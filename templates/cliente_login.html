<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - RapidFood</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body style="background:#f8f8f8;">

<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem;">
    <div style="background:#fff; border-radius:16px; border:1px solid #eee; padding:2.5rem; width:100%; max-width:420px;">

        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:40px; margin-bottom:0.5rem;">🛵</div>
            <h2 style="font-size:22px; color:#1a1a2e;">Bienvenido</h2>
            <p style="font-size:14px; color:#666;">Inicia sesión para ver tus pedidos</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>Correo electrónico</label>
                <input type="email" name="email" placeholder="tu@correo.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" placeholder="Tu contraseña" required>
            </div>
            <button type="submit" class="btn-confirmar">
                <i class="ti ti-login"></i> Iniciar sesión
            </button>
        </form>

        <p style="text-align:center; margin-top:1rem; font-size:13px; color:#999;">
            ¿No tienes cuenta? <a href="/cliente/registro" style="color:#f97316;">Regístrate aquí</a>
        </p>

        <p style="text-align:center; margin-top:0.5rem; font-size:13px; color:#999;">
            <a href="/" style="color:#999;">Volver al inicio</a>
        </p>

    </div>
</div>

</body>
</html>
